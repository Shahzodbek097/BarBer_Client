# BarBer_Client — DEV muhit
# Ishga tushirish (repo ildizidan):
#   docker compose -f docker/docker-compose.dev.yml up -d --build
# To'xtatish:
#   docker compose -f docker/docker-compose.dev.yml down

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: barber_db
    environment:
      POSTGRES_DB: barber_client
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: barber
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barber -d barber_client"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: barber_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile.dev
    container_name: barber_web
    command: sh -c "python manage.py migrate && python manage.py loaddata regions && python manage.py runserver 0.0.0.0:8000 --noreload"
    volumes:
      - ../backend:/app/backend
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: dev-secret-key-not-for-production
      DATABASE_URL: postgres://barber:barber@db:5432/barber_client
      REDIS_URL: redis://redis:6379/0
      REDIS_BROKER_URL: redis://redis:6379/1
      REDIS_CHANNEL_URL: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile.dev
    container_name: barber_celery
    command: celery -A config worker -l info
    volumes:
      - ../backend:/app/backend
    environment:
      DEBUG: "True"
      SECRET_KEY: dev-secret-key-not-for-production
      DATABASE_URL: postgres://barber:barber@db:5432/barber_client
      REDIS_URL: redis://redis:6379/0
      REDIS_BROKER_URL: redis://redis:6379/1
      REDIS_CHANNEL_URL: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
