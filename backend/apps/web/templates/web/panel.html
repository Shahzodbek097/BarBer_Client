{% extends "web/base.html" %}
{% load static %}
{% block title %}Admin panel — BarBer{% endblock %}
{% block content %}
<div id="guard"></div>
<div id="panel-app" class="hidden">
  <h1>Super admin panel</h1>
  <div class="stats" id="stats"></div>

  <div class="card mt">
    <h2>Salon moderatsiyasi</h2>
    <div class="chips" id="salon-tabs">
      <button class="chip active" data-status="">Barchasi</button>
      <button class="chip" data-status="pending">Tasdiqlanmagan</button>
      <button class="chip" data-status="approved">Tasdiqlangan</button>
      <button class="chip" data-status="blocked">Bloklangan</button>
    </div>
    <section id="salon-list" class="stack mt"></section>
    <p id="empty" class="empty hidden">Salonlar yo'q.</p>
  </div>

  <div class="card mt">
    <h2>Hisobot</h2>
    <p class="muted">Salonlar bo'yicha oylik umumiy hisobot Excel faylida.</p>
    <button id="export-btn" class="btn btn-sm">⬇ Excel (bu oy)</button>
    <p id="export-error" class="error-text hidden"></p>
  </div>
</div>
{% endblock %}
{% block scripts %}<script type="module" src="{% static 'web/js/pages/panel.js' %}?v={{ STATIC_VERSION }}"></script>{% endblock %}
