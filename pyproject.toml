# BarBer_Client — umumiy tool konfiguratsiyasi
# Ruff: lint + format (black va isort o'rnini bosadi — yagona formatlovchi)

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "migrations", "node_modules", "staticfiles", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
